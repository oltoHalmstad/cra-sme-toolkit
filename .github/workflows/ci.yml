name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"     # weekly: catches dependency drift in notebooks
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install LibreOffice (workbook formula parity tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc
      - name: Install (pinned constraints)
        run: python -m pip install -c constraints-ci.txt -e ".[test,notebooks,analysis]"
      - name: Release metadata consistency
        run: python tools/check_release.py
      - name: Tests (incl. negative scan/evidence scenarios)
        run: pytest -q
      - name: Seeded-fault suite (false-green rate must be 0)
        run: python tools/mutation_suite.py --out mutation-results
      - name: No secrets / personal data in publishable folders
        run: python tools/redact_check.py examples experiments notebooks docs comparison templates data
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel, install into clean venv, run packaged CLI on demo bundle
        run: python tools/verify_package.py --constraints constraints-ci.txt
  notebooks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -c constraints-ci.txt -e ".[test,notebooks,analysis]" && python -m ipykernel install --user
      - name: Execute notebooks (outputs discarded; committed notebooks stay as released)
        run: python tools/run_notebooks.py && git diff --stat
