# E9 retrospective release replay (research workflow; manual trigger).
# Runs where OSV, CISA KEV and package registries are reachable. ~1–3 h on GitHub-hosted runners.
# Output: artifact "e9-results" (CSV results, data cache with fetch timestamps, executed notebook 08).
name: e9-replay
on:
  workflow_dispatch:
    inputs:
      include_dev:
        description: "Also count dev dependencies (sensitivity analysis)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  resolve:
    # products whose inventory is not a committed lockfile: time-travelled resolution or Syft
    strategy:
      fail-fast: false
      matrix:
        product: [octoprint, node-red, thingsboard, openhab-core, emqx, mosquitto, tasmota, pihole-ftl]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - run: python -m pip install -q -c constraints-ci.txt -e . && python -m pip install -q uv
      - name: Resolve inventories as of each release date
        run: python tools/replay/resolve_ci.py --e9 experiments/e9_release_replay --product ${{ matrix.product }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inv-${{ matrix.product }}
          path: experiments/e9_release_replay/inventories/${{ matrix.product }}*
          if-no-files-found: warn

  sbom:
    # E1 at scale: Syft on every release checkout vs the lockfile inventory; SBOMs kept for OpenCRA
    strategy:
      fail-fast: false
      matrix:
        product: [zigbee2mqtt, node-red, homebridge, zwave-js-ui, home-assistant, esphome, octoprint, frigate,
                  adguardhome, headscale, traefik, telegraf, evcc, thingsboard, openhab-core, mosquitto, tasmota,
                  pihole-ftl, influxdb3, emqx]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - run: python -m pip install -q -c constraints-ci.txt -e .
      - run: python tools/replay/sbom_vs_lockfile.py --e9 experiments/e9_release_replay --product ${{ matrix.product }} --out sbom-results
      - name: Keep Syft SBOMs
        run: mkdir -p sboms && for d in /tmp/e9-sbom/*/; do b=$(basename "$d"); [ -f "$d/syft.cdx.json" ] && cp "$d/syft.cdx.json" "sboms/$b.cdx.json"; done; ls sboms | wc -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.product }}
          path: |
            sbom-results/
            sboms/

  replay:
    needs: [resolve, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # only to publish logs + results to branch e9-results-run-<id> (always runs)
    defaults:
      run:
        shell: bash     # -eo pipefail, so `| tee` keeps the step's exit code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q -c constraints-ci.txt -e ".[test,notebooks]" && python -m ipykernel install --user
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: inv-*
          path: experiments/e9_release_replay/inventories
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: e9-sbom
          merge-multiple: true
      - name: Fetch OSV / KEV / registry data (fails if KEV unavailable)
        run: mkdir -p e9-results/logs && python tools/replay/fetch_data.py --inventories experiments/e9_release_replay/inventories --cache e9-cache ${{ inputs.include_dev && '--include-dev' || '' }} 2>&1 | tee e9-results/logs/fetch.log
      - name: Replay all releases (offline from cache)
        run: python tools/replay/run_replay.py --e9 experiments/e9_release_replay --cache e9-cache --out e9-results ${{ inputs.include_dev && '--include-dev' || '' }} 2>&1 | tee e9-results/logs/replay.log
      - name: Draw the pre-registered validation sample (seed 2026; blinded rater sheets)
        run: python tools/replay/validation.py sample --results e9-results --e9 experiments/e9_release_replay --out e9-results/validation 2>&1 | tee e9-results/logs/validation.log
      - name: OpenCRA head-to-head (current knowledge) + fail-safe probes
        run: tools/replay/opencra_compare.sh e9-sbom/sboms e9-results/opencra 2>&1 | tee e9-results/logs/opencra.log
      - name: Analysis notebook on real results
        env:
          E9_RESULTS: ${{ github.workspace }}/e9-results
        run: |
          if ls e9-sbom/sbom-results/*.csv >/dev/null 2>&1; then cp e9-sbom/sbom-results/*.csv e9-results/; fi
          python tools/run_notebooks.py notebooks/08_release_replay_E9.ipynb 2>&1 | tee e9-results/logs/notebook.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e9-results
          path: |
            e9-results/
            e9-cache/kev.json
            e9-cache/MANIFEST.json
            experiments/e9_release_replay/inventories/
            notebooks/08_release_replay_E9.ipynb
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e9-osv-cache
          path: e9-cache/
          retention-days: 90
      - name: Publish logs and results to branch e9-results-run-<id> (always)
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          D="$(mktemp -d)"; mkdir -p "$D/e9-results" "$D/inventories"
          [ -d e9-results ] && cp -r e9-results/. "$D/e9-results/"
          for f in e9-cache/kev.json e9-cache/MANIFEST.json; do [ -f "$f" ] && cp "$f" "$D/e9-results/"; done
          cp -r experiments/e9_release_replay/inventories/. "$D/inventories/" 2>/dev/null || true
          [ -f notebooks/08_release_replay_E9.ipynb ] && cp notebooks/08_release_replay_E9.ipynb "$D/"
          printf '{"run_id": "%s", "source_commit": "%s", "job_status": "%s"}\n' "$RUN_ID" "$SHA" "$JOB_STATUS" > "$D/RUN-INFO.json"
          cd "$D" && git init -q && git checkout -q -b "e9-results-run-$RUN_ID"
          git -c user.name="e9-replay" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="e9-replay" -c user.email="actions@users.noreply.github.com" commit -q -m "E9 results, run $RUN_ID (source $SHA, status $JOB_STATUS)"
          git push -q "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/e9-results-run-$RUN_ID"
