name: Bug report
description: Something in crasme/, tools/, notebooks or workflows does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce (versions, command, input file — synthetic only) }
    validations: { required: true }
