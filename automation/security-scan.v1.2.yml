# CRA-SME v1.2 evidence + release-decision workflow. Copy to .github/workflows/cra-evidence.yml
# and copy the toolkit's crasme/ and tools/ folders (or `pip install crasme`) into the product repo.
#
# v1.2 changes (recommendations P0-01, P0-02, P0-04, P1-05):
#  * no `|| true`, no `continue-on-error`, no empty-KEV fallback. Every scan writes an explicit
#    execution-status record (tools/run_scan.py); failures become REVIEW_REQUIRED, never "clean".
#  * one release decision (crasme.gate): PASS / FAIL / REVIEW_REQUIRED + reason codes,
#    bound to product id, version, build SHA and artifact digest.
#  * secret-scan output is redacted before it is stored as evidence.
#  * actions pinned to full commit SHAs (resolved with `git ls-remote`, 2026-10-17).
#
# PASS = technically eligible for HUMAN conformity review. It is not a conformity statement.
name: cra-evidence
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  PRODUCT_ID: DEMO-001            # replace
  PRODUCT_VERSION: 1.2.0          # replace / derive from tag
  SYFT_VERSION: v1.52.0
  TRIVY_VERSION: v0.76.0
  OSV_VERSION: v2.6.0
  SEMGREP_VERSION: "1.181.0"
  KEV_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      M: evidence/scan-status.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Product record (binds all evidence to this build)
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, os, pathlib
          lock = next((p for p in ["package-lock.json", "poetry.lock", "requirements.txt", "go.sum"] if pathlib.Path(p).exists()), None)
          inputs = {"lockfile": hashlib.sha256(pathlib.Path(lock).read_bytes()).hexdigest()} if lock else {}
          json.dump({"product_id": os.environ["PRODUCT_ID"], "product_version": os.environ["PRODUCT_VERSION"],
                     "build_sha": os.environ["GITHUB_SHA"], "input_digests": inputs},
                    open("evidence/product.json", "w"), indent=2)
          PY
          # add "artifact_digest": "sha256:<digest of released image/firmware>" once the artifact is built

      - name: SBOM (CycloneDX) — Annex I Part II(1)
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: evidence/sbom.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
      - name: Record SBOM status
        if: always()
        run: python tools/run_scan.py --manifest $M --product "$PRODUCT_ID" --build "$GITHUB_SHA" --name sbom --tool action --kind cyclonedx --tool-version "syft $SYFT_VERSION" --output evidence/sbom.cdx.json --step-outcome "${{ steps.sbom.outcome }}"

      - name: Vulnerabilities from SBOM — Annex I Part I(2)(a), Part II(2)
        id: vulns
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: evidence/sbom.cdx.json
          format: json
          output: evidence/vulns.json
          exit-code: "0"
          version: ${{ env.TRIVY_VERSION }}
      - name: Record vulnerability-scan status
        if: always()
        run: python tools/run_scan.py --manifest $M --product "$PRODUCT_ID" --build "$GITHUB_SHA" --name vulns --tool action --kind trivy --tool-version "trivy $TRIVY_VERSION" --output evidence/vulns.json --input-path evidence/sbom.cdx.json --step-outcome "${{ steps.vulns.outcome }}"

      - name: Secrets and misconfiguration — Annex I Part I(2)(d),(j)
        id: fs
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: json
          output: evidence/trivy-fs.json
          exit-code: "0"
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
      - name: Record secret/misconfig status (secret values redacted)
        if: always()
        run: python tools/run_scan.py --manifest $M --product "$PRODUCT_ID" --build "$GITHUB_SHA" --name fs --tool action --kind trivy --tool-version "trivy $TRIVY_VERSION" --output evidence/trivy-fs.json --redact-secrets --step-outcome "${{ steps.fs.outcome }}"

      - name: OSV cross-check (second source; optional for release)
        if: always()
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@$OSV_VERSION
          python tools/run_scan.py --manifest $M --product "$PRODUCT_ID" --build "$GITHUB_SHA" --name osv --tool osv-scanner --kind osv --optional --tool-version "$OSV_VERSION" --output evidence/osv.json -- "$(go env GOPATH)/bin/osv-scanner" scan source -r --format json --output evidence/osv.json .

      - name: SAST (Semgrep; optional for release)
        if: always()
        run: |
          python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          python tools/run_scan.py --manifest $M --product "$PRODUCT_ID" --build "$GITHUB_SHA" --name sast --tool semgrep --kind sarif --optional --tool-version "$SEMGREP_VERSION" --output evidence/semgrep.sarif -- semgrep scan --config p/default --sarif --output evidence/semgrep.sarif --metrics off

      - name: Known-exploited feed (no fallback — failure means REVIEW_REQUIRED)
        if: always()
        run: python tools/run_scan.py --manifest $M --product "$PRODUCT_ID" --build "$GITHUB_SHA" --name kev --tool curl --kind kev --tool-version curl --output evidence/kev.json --timeout 120 -- curl -fsSL --retry 3 "$KEV_URL" -o evidence/kev.json

      - name: Evidence manifest (build-bound, hashed)
        if: always()
        run: |
          set -e
          m=evidence/evidence-manifest.json
          base="--product $PRODUCT_ID --product-version $PRODUCT_VERSION --build $GITHUB_SHA --out $m"
          lockarg=""; for f in package-lock.json poetry.lock requirements.txt go.sum; do [ -f "$f" ] && lockarg="--input lockfile=$f" && break; done
          [ -f evidence/sbom.cdx.json ] && python -m crasme.provenance $base --tool syft --tool-version "$SYFT_VERSION" --evidence-type sbom --evidence evidence/sbom.cdx.json --requirement P2-1 --requirement SC-01 $lockarg
          [ -f evidence/vulns.json ] && python -m crasme.provenance $base --tool trivy --tool-version "$TRIVY_VERSION" --evidence-type vulns --evidence evidence/vulns.json --requirement P1-a --requirement P2-2 $lockarg
          # Obligation evidence (documents, test reports) and trace-units.json / approvals.json / vex.json
          # are maintained in the repository (e.g. compliance/) and copied in here:
          if [ -d compliance ]; then cp -r compliance/. evidence/; else echo "no compliance/ folder: obligations will be REVIEW_REQUIRED"; fi

      - name: Release decision (PASS / FAIL / REVIEW_REQUIRED)
        id: decision
        if: always()
        run: python tools/ci_gate.py --bundle evidence --policy policy.yaml --out evidence/decision.json --report evidence/decision.md

      - name: Decision summary
        if: always()
        run: cat evidence/decision.md >> "$GITHUB_STEP_SUMMARY" || echo "decision report missing" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cra-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90   # CI retention only; archive per your retention policy (TD-02, docs/evidence-data-governance.md)
          if-no-files-found: error

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cra-evidence-${{ github.sha }}
          path: evidence
      - name: Sign decision + evidence (build provenance attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/*
